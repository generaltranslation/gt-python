name: Release

on:
  push:
    branches: [main]
  # Run by hand to publish every package version that is not on PyPI yet.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changesets
        id: changesets
        run: |
          COUNT=$(find .sampo/changesets -name '*.md' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        if: steps.changesets.outputs.count != '0'
      - run: uv sync --all-packages
        if: steps.changesets.outputs.count != '0'
      - name: Create Release Pull Request
        if: steps.changesets.outputs.count != '0'
        uses: bruits/sampo/crates/sampo-github-action@main
        with:
          command: auto
          pr-title: "chore(release): bump versions and changelogs"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to PyPI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v6

      - name: Check for version changes
        id: check
        run: |
          CHANGED=$(git diff HEAD~1 -- 'packages/*/pyproject.toml' | grep -c '^+version' || true)
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Create tags and GitHub releases
        id: tag
        if: steps.check.outputs.changed != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_PACKAGES=""
          for pkg in packages/*/; do
            name=$(grep '^name = ' "$pkg/pyproject.toml" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            version=$(grep '^version = ' "$pkg/pyproject.toml" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            tag="${name}@${version}"
            if ! git tag -l "$tag" | grep -q .; then
              git tag "$tag"
              git push origin "$tag"
              echo "Tagged $tag"
              NEW_PACKAGES="$NEW_PACKAGES $name"
            fi
          done

          # Create GitHub releases for each new tag
          for pkg in packages/*/; do
            name=$(grep '^name = ' "$pkg/pyproject.toml" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            version=$(grep '^version = ' "$pkg/pyproject.toml" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            tag="${name}@${version}"
            # Only create releases for packages that were newly tagged
            if echo "$NEW_PACKAGES" | grep -qw "$name"; then
              gh release create "$tag" --title "$tag" --generate-notes
              echo "Created release $tag"
            fi
          done

          echo "new_packages=$NEW_PACKAGES" >> "$GITHUB_OUTPUT"

      # A release run (a version bump on main) or a manual run builds every package
      # version that PyPI does not have, not only the newly tagged ones, and does so
      # even when tagging or release notes failed. A current version that missed PyPI
      # is published by the next such run. Older versions are not rebuilt. A version
      # that has only its sdist or only its wheel on PyPI, because an upload stopped
      # partway, gets the missing file. A package whose code changed since its
      # version's tag stops the whole run, so nothing is published until that
      # package's version is bumped.
      - name: Build package versions missing from PyPI
        id: build
        if: ${{ !cancelled() && (steps.check.outputs.changed != '0' || github.event_name == 'workflow_dispatch') }}
        run: |
          for pkg in packages/*/; do
            grep -q '\[build-system\]' "$pkg/pyproject.toml" 2>/dev/null || continue
            name=$(grep '^name = ' "$pkg/pyproject.toml" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            version=$(grep '^version = ' "$pkg/pyproject.toml" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            status=$(curl -sS -o "$RUNNER_TEMP/pypi.json" -w '%{http_code}' --retry 3 --retry-all-errors "https://pypi.org/pypi/$name/$version/json" || true)
            case "$status" in
              200) on_pypi=$(jq -r '[.urls[].packagetype] | unique | join(" ")' "$RUNNER_TEMP/pypi.json") ;;
              404) on_pypi="" ;;
              *) echo "::error::PyPI returned $status for $name $version"; exit 1 ;;
            esac
            case "$on_pypi" in
              "bdist_wheel sdist") echo "$name $version is already on PyPI"; continue ;;
              bdist_wheel) only="--sdist"; echo "$name $version is on PyPI without its sdist" ;;
              sdist) only="--wheel"; echo "$name $version is on PyPI without its wheel" ;;
              *) only="" ;;
            esac
            # A version must be published from the code it was tagged with.
            tag="${name}@${version}"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null &&
               ! git diff --quiet "$tag" HEAD -- "$pkg" ":(exclude)${pkg}README.md" ":(exclude)${pkg}CHANGELOG.md"; then
              echo "::error::$name changed since $tag; bump its version before publishing"
              exit 1
            fi
            echo "Building $name $version"
            uv build --package "$name" --out-dir dist/ ${only:+"$only"}
          done

      - name: Publish to PyPI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if ls dist/* >/dev/null 2>&1; then
            uv publish dist/*
          else
            echo "Every package version is already on PyPI"
          fi
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
